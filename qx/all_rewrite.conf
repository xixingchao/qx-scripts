# QX 签到脚本登录态捕获总开关
# 放到 QX 的引用资源 - 重写里，勾选时捕获 Cookie，取消勾选时停止后台捕获。

[rewrite_local]
^https:\/\/www\.52pojie\.cn\/(?:home\.php|portal\.php) url script-request-header https://raw.githubusercontent.com/xixingchao/qx-scripts/main/qx/52pj_qx.js
^https:\/\/www\.nodeseek\.com\/(?:$|board|api\/account|api\/attendance) url script-request-header https://raw.githubusercontent.com/xixingchao/qx-scripts/main/qx/nodeseek_qx.js

[mitm]
hostname = www.52pojie.cn, www.nodeseek.com
